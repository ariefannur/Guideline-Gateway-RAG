[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guideline-gateway"
version = "0.1.0"
description = "Domain-agnostic, offline-first question-answering system using RAG and Small Language Models (SLM)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Guideline Gateway Team" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
    "llama-cpp-python>=0.2.80",
    "onnxruntime>=1.18.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
guideline = "cli.main:app"
kpack = "cli.main:kpack_app"

[tool.hatch.build.targets.wheel]
packages = ["engine", "kpack", "profiles", "server", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
